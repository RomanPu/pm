[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "google-genai>=2.29.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call the real Gemini API; run them with `pytest -m live`
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY)"]
addopts = "-m 'not live'"
